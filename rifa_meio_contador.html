<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rifa Meio Contador</title><style>body{font-family:Arial;margin:0;background:#f7e8d0;color:#5a2413}header{background:#5a2413;color:#fff;text-align:center;padding:20px}main{max-width:900px;margin:auto;padding:14px}.info{display:flex;gap:8px;flex-wrap:wrap}.card{background:#fff;padding:12px;border-radius:10px;flex:1;text-align:center}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;background:#fff;padding:10px;border-radius:12px}.n{padding:12px 2px;text-align:center;border:2px solid #d99a20;border-radius:8px;font-weight:bold}.v{background:#ddd;border-color:#aaa;color:#777}input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #cdb8a8;border-radius:8px;box-sizing:border-box}@media(max-width:600px){.grid{grid-template-columns:repeat(5,1fr)}}</style></head><body><header><h1>RIFA — MEIO CONTADOR</h1><p>4º PERÍODO DE CIÊNCIAS CONTÁBEIS</p><p>Cesta Cacau Show • R$ 5,00 • Sorteio: 08 de outubro</p></header><main><div class="info"><div class="card">400<br><b>NÚMEROS</b></div><div class="card">R$ 5,00<br><b>VALOR</b></div><div class="card">20<br><b>VENDEDORES</b></div></div><input id="q" placeholder="🔎 Procurar número" oninput="r()"><select id="s" onchange="r()"><option value="">Todos os vendedores</option></select><p>🟨 Disponível &nbsp; | &nbsp; ⬜ Vendido</p><div id="g" class="grid"></div></main><script>const K='rifa_mc_2026';let d=JSON.parse(localStorage.getItem(K)||'{}');for(let i=1;i<=20;i++){let o=document.createElement('option');o.value=i;o.textContent=`Pessoa ${String(i).padStart(2,'0')} — ${String((i-1)*20+1).padStart(3,'0')} a ${String(i*20).padStart(3,'0')}`;s.appendChild(o)}function r(){g.innerHTML='';let q=document.getElementById('q').value.trim(),f=Number(s.value)||0;for(let n=1;n<=400;n++){let owner=Math.ceil(n/20);if(f&&owner!==f)continue;if(q&&!String(n).padStart(3,'0').includes(q))continue;let e=document.createElement('div');e.className='n '+(d[n]?'v':'');e.textContent=String(n).padStart(3,'0');e.onclick=()=>{if(d[n]){if(confirm('Desmarcar '+e.textContent+'?'))delete d[n]}else if(confirm('Marcar '+e.textContent+' como vendido?'))d[n]=1;localStorage.setItem(K,JSON.stringify(d));r()};g.appendChild(e)}}r();</script></body></html>
